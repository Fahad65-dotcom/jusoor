name: Build APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q jusoor_github_ready.zip
      - name: Fix AGP version
        run: sed -i 's/version "9.1.0"/version "9.1.1"/' jusoor_app/android/settings.gradle.kts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build APK
        working-directory: jusoor_app
        run: |
          flutter pub get
          flutter build apk --release
      - run: cp jusoor_app/build/app/outputs/flutter-apk/app-release.apk jusoor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jusoor-apk
          path: jusoor.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: jusoor.apk
