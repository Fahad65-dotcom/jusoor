name: Build APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q jusoor_github_ready.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: jusoor_app
        run: |
          flutter pub get
          flutter build apk --release
      - run: cp jusoor_app/build/app/outputs/flutter-apk/app-release.apk jusoor.apk
      - uses: actions/upload-artifact@v4
        with:
          name: jusoor-apk
          path: jusoor.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: jusoor.apk
